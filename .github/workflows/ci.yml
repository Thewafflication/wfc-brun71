name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install the pinned tools
        shell: pwsh
        run: |
          python -m pip install --requirement requirements-dev.txt
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          python -m pip install pyyaml

      - name: Lint
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Invoke-Lint.ps1

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86, platform: Win32, runner: windows-2022 }
          - { arch: x64, platform: x64, runner: windows-2022 }
          - { arch: arm64, platform: ARM64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B out/build -A ${{ matrix.platform }}

      - name: Build
        shell: pwsh
        run: cmake --build out/build --config Debug

      - name: Test
        shell: pwsh
        run: ctest --test-dir out/build -C Debug --output-on-failure
